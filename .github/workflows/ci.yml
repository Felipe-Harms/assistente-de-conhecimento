name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: upworkkb
          POSTGRES_PASSWORD: change-me-locally-only
          POSTGRES_DB: upworkkb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upworkkb -d upworkkb -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Stubs only — CI must run offline. Flipping these to real keys
      # is a separate, manual step the operator takes on a self-hosted
      # runner with credentials wired through secrets.
      EMBEDDING_STUB: "true"
      CHAT_STUB: "true"
      AUTH_ENABLED: "false"
      EMBEDDING_DIM: "1536"
      RETRIEVAL_MIN_SCORE: "0.20"
      DATABASE_URL: postgresql+asyncpg://upworkkb:change-me-locally-only@localhost:5432/upworkkb
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bring up the full stack via docker compose so PostgreSQL
      # receives db/init.sql (mounted under docker-entrypoint-initdb.d)
      # and the api service can run its first request against the
      # schema. We rely on the compose healthchecks — `--wait` blocks
      # until db/api/ui report healthy, so subsequent steps can assume
      # a live API on http://api:8000.
      - name: seed .env from template
        working-directory: ${{ github.workspace }}
        run: cp .env.example .env

      - name: docker compose up (db + api + ui + test)
        working-directory: ${{ github.workspace }}
        run: docker compose up -d --build --wait

      - name: Install api requirements
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r tests/requirements.txt

      - name: py_compile (api + tests)
        working-directory: ${{ github.workspace }}
        run: |
          python -m compileall -q api/app tests

      - name: docker compose config
        working-directory: ${{ github.workspace }}
        run: docker compose config --quiet

      # The `services: postgres` container starts in parallel with the job
      # and GH Actions does not wait for its healthcheck before running
      # steps. A fresh pgvector volume needs a few seconds for the cluster
      # to accept connections; without this wait, the integration /
      # acceptance suites hit `db: down` on /readyz.
      - name: "wait for services: postgres"
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/5432) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "postgres not reachable on localhost:5432 within 60s"
          exit 1

      # `test_proof_build_contract.py` is a build-time contract that
      # asserts on `/srv/repo/...` paths inside the test container. It is
      # meant to run via `docker compose run --rm test pytest
      # tests/acceptance` — not on the runner — so exclude it from the
      # runner pytest step.
      - name: pytest (security + integration + acceptance + unit)
        working-directory: ${{ github.workspace }}
        run: |
          PYTHONPATH=api python -m pytest -q \
            tests/unit \
            tests/security \
            tests/integration \
            tests/acceptance \
            --ignore=tests/acceptance/test_proof_build_contract.py

      - name: scripts/run-proof.sh (REQ-005)
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-proof.sh

      - name: scripts/test-all.sh (REQ-008 / REQ-010 smoke)
        working-directory: ${{ github.workspace }}
        run: |
          ./scripts/test-all.sh

      - name: docker compose down (preserve pg_data volume)
        working-directory: ${{ github.workspace }}
        run: docker compose down --remove-orphans