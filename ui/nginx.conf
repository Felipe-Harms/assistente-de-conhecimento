server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tiny security baseline — never trust the upstream implicitly.
    server_tokens off;

    # Static assets — long cache.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Healthcheck passthrough (the UI container itself is the probe target).
    location = /healthz-ui {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API proxy — UI does not see upstream URL.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Single-page fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
